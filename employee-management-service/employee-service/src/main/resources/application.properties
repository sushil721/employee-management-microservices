spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Micrometer Configuration for Tracing

management.tracing.sampling.probability=1
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false
management.tracing.export.zipkin.enabled=true
management.tracing.export.zipkin.endpoint=http://localhost:9411/api/v2/spans
management.zipkin.enabled=true
management.zipkin.tracing.enabled=true
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans
spring.zipkin.base-url=http://localhost:9411

#spring.boot.message=Employee Service is Running!

### Circuit Breaker Configuration

## Actuator endpoint configuration for resilience4j URL: http://localhost:8082/actuator/circuitbreakers
management.health.resilience4j.enabled=true
management.health.circuitbreakers.enabled=true
management.health.circuitbreaker.enabled=true
#management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always

## Resilience4j Circuit Breaker configuration

resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.failureRateThreshold=50
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.slidingWindowSize=10
resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.slidingWindowType=COUNT_BASED
#resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.slowCallRateThreshold=50
#resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.slowCallDurationThreshold=2000
#resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.recordExceptions=java.io.IOException,java.util.concurrent.TimeoutException
#resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.ignoreExceptions=org.springframework.web.client.HttpClientErrorException
#resilience4j.circuitbreaker.instances.EMPLOYEE-SERVICE.eventConsumerBufferSize=100

## Retry Pattern using Resilience4J configuration

resilience4j.retry.instances.EMPLOYEE-SERVICE.registerHealthIndicator=true
resilience4j.retry.instances.EMPLOYEE-SERVICE.maxAttempts=5
resilience4j.retry.instances.EMPLOYEE-SERVICE.waitDuration=1s
