##Spring Cloud Netflix Eureka Service Registry properties
eureka.client.service-url.defaultZone=http://localhost:8083/eureka/

#Spring Cloud Config Server properties
spring.config.import=optional:configserver:http://localhost:8888

# Actuator endpoint configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Micrometer Configuration for Tracing
#management.tracing.sampling.probability=1.0
#logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
management.tracing.enabled=true
management.tracing.zipkin.enabled=true
management.tracing.zipkin.base-url=http://localhost:9411
